<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Surebound Agent Registration">
    <title>Agent Registration – Surebound Insurance Portal</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/icon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sb-navy-950: #070e17;
            --sb-navy-900: #0b1524;
            --sb-emerald-500: #10b981;
            --sb-emerald-600: #059669;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-subtle: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #070e17 0%, #0b1524 50%, #0f1c2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 36px 32px;
            position: relative;
            z-index: 2;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-icon-wrap {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        .brand-icon-wrap svg {
            width: 24px;
            height: 24px;
            color: #ffffff;
        }

        .brand-name {
            font-size: 1.375rem;
            font-weight: 800;
            color: #0b1524;
            letter-spacing: -0.02em;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .auth-subtitle {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: span 2;
            margin-bottom: 0;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            font-size: 0.875rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--text-primary);
            transition: all 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--sb-emerald-500);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, var(--sb-emerald-600) 0%, var(--sb-emerald-500) 100%);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            margin-top: 18px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--sb-emerald-600);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .error-alert {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-brand">
            <div class="brand-icon-wrap">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
                </svg>
            </div>
            <span class="brand-name">Surebound</span>
        </div>

        <div class="auth-header">
            <h1 class="auth-title">Register Agent Account</h1>
            <p class="auth-subtitle">Create an account to access policies, leads and claims</p>
        </div>

        
        <form action="/register" method="POST">
            <input type="hidden" name="_token" value="" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="name">Full Name *</label>
                <input type="text" name="name" id="name" class="form-input" value="" required placeholder="e.g. Marcus Sterling">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Work Email *</label>
                <input type="email" name="email" id="email" class="form-input" value="" required placeholder="marcus@surebound.com">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="title">Title / Role</label>
                    <input type="text" name="title" id="title" class="form-input" value="" placeholder="Underwriter">
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Direct Phone</label>
                    <input type="tel" name="phone" id="phone" class="form-input" value="" placeholder="(206) 555-0100">
                </div>
            </div>

            <div class="form-grid" style="margin-top: 6px;">
                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" name="password" id="password" class="form-input" required placeholder="Min 8 characters">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password_confirmation">Confirm Password *</label>
                    <input type="password" name="password_confirmation" id="password_confirmation" class="form-input" required placeholder="Retype password">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Complete Registration
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an agent profile? <a href="/login" class="auth-link">Sign In</a></p>
        </div>
    </div>

</body>
</html>
